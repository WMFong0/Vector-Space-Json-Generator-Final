<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload documents - Step 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Step 1 - File Upload</p>
          <h1>Upload PDF documents</h1>
        </div>
      </header>

      <!-- Display error messages if any -->
      {% if errors %}
      <div class="alert alert-error">
        <ul>
          {% for e in errors %}<li>{{ e }}</li>{% endfor %}
        </ul>
      </div>
      {% endif %}

      <!-- Upload form with multi-file support -->
      <main class="grid">
        <section class="panel">
          <form method="post" enctype="multipart/form-data">
            <div class="field-group">
              <label for="pdf_files">PDF files</label>
              <input id="pdf_files" name="pdf_files" type="file" accept="application/pdf" multiple />
            </div>
            <button class="primary" type="submit">Next</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
